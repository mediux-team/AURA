basePath: /
definitions:
  autodownload.AutoDownloadResult:
    properties:
      item:
        type: string
      overall_message:
        type: string
      overall_result:
        type: string
      sets:
        items:
          $ref: '#/definitions/autodownload.AutoDownloadSetResult'
        type: array
    type: object
  autodownload.AutoDownloadSetResult:
    properties:
      id:
        type: string
      reason:
        type: string
      result:
        type: string
      title:
        type: string
      user_created:
        type: string
    type: object
  autodownload.FavoriteCreatorsResult:
    properties:
      checked:
        description: Items without a saved set
        type: integer
      no_set:
        description: Items none of the favorite creators have a set for
        type: integer
      queued:
        description: Items a set was added to the Download Queue for
        type: integer
    type: object
  autodownload.UpgradeItem:
    properties:
      edition:
        type: string
      library_title:
        type: string
      tmdb_id:
        type: string
    type: object
  autodownload.UpgradeSavedSetsResult:
    properties:
      checked:
        description: Saved items that can be upgraded
        type: integer
      upgraded:
        description: Items a better set was added to the Download Queue for
        type: integer
    type: object
  config.Config:
    properties:
      auth:
        allOf:
        - $ref: '#/definitions/config.Config_Auth'
        description: Authentication settings.
      backups:
        allOf:
        - $ref: '#/definitions/config.Config_Backups'
        description: Database backup settings.
      images:
        allOf:
        - $ref: '#/definitions/config.Config_Images'
        description: Image settings.
      jobs:
        allOf:
        - $ref: '#/definitions/config.Config_Jobs'
        description: Background jobs scheduling configuration.
      labels_and_tags:
        allOf:
        - $ref: '#/definitions/config.Config_LabelsAndTags'
        description: Labels and tags settings.
      logging:
        allOf:
        - $ref: '#/definitions/config.Config_Logging'
        description: Logging configuration settings.
      main_media_server:
        description: ID of the main media server.
        type: string
      media_server:
        allOf:
        - $ref: '#/definitions/config.Config_MediaServer'
        description: The main media server, kept in sync with its entry in MediaServers.
          Not stored.
      media_servers:
        description: Every media server. One of them is the main server.
        items:
          $ref: '#/definitions/config.Config_MediaServer'
        type: array
      mediux:
        allOf:
        - $ref: '#/definitions/config.Config_Mediux'
        description: MediUX integration settings.
      notifications:
        allOf:
        - $ref: '#/definitions/config.Config_Notifications'
        description: Notification settings.
      sonarr_radarr:
        allOf:
        - $ref: '#/definitions/config.Config_SonarrRadarr_Apps'
        description: List of Sonarr/Radarr instances to integrate with.
      tmdb:
        allOf:
        - $ref: '#/definitions/config.Config_TMDB'
        description: TMDB (The Movie Database) integration settings.
      user_preferences:
        allOf:
        - $ref: '#/definitions/config.Config_UserPreferences'
        description: User preferences, shared between sessions and devices.
    type: object
  config.Config_Auth:
    properties:
      allowed_origins:
        description: |-
          AllowedOrigins is an optional list of extra origins allowed to make credentialed
          cross-origin requests (cookies/API key headers). The standard deployment (Next.js server
          proxying /api/* to the Go backend) never needs this - the browser only ever talks to one
          origin. Only set this if you're calling the API directly from a different origin.
        items:
          type: string
        type: array
      enabled:
        description: Whether to enable authentication.
        type: boolean
      oidc:
        allOf:
        - $ref: '#/definitions/config.Config_Auth_OIDC'
        description: OIDC (Single Sign-On) login settings.
      password:
        description: Password for authentication.
        type: string
      password_enabled:
        description: Whether logging in with the password is allowed. Turn it off
          to only log in with Single Sign-On.
        type: boolean
      session_cookie_secure:
        description: SessionCookieSecure controls the Secure attribute of the browser
          session cookie.
        type: string
      trust_proxy_for_cookie_secure:
        description: |-
          TrustProxyForCookieSecure, when true, also treats X-Forwarded-Proto: https as a secure transport
          signal (for reverse-proxy TLS termination setups). Defaults to false since that header is
          attacker-controllable unless the proxy is guaranteed to strip/overwrite it.
        type: boolean
    type: object
  config.Config_Auth_OIDC:
    properties:
      allowed_domains:
        description: Optional allowlist of email domains (e.g. "example.com") permitted
          to log in via OIDC. Empty = any domain allowed.
        items:
          type: string
        type: array
      allowed_emails:
        description: Optional allowlist of exact emails permitted to log in via OIDC.
          Empty = any authenticated IdP user is allowed.
        items:
          type: string
        type: array
      client_id:
        description: OIDC client ID.
        type: string
      client_secret:
        description: OIDC client secret.
        type: string
      enabled:
        description: Whether OIDC (Single Sign-On) login is enabled.
        type: boolean
      issuer_url:
        description: OIDC issuer URL (used for discovery).
        type: string
      redirect_urls:
        description: Callback URLs registered with the IdP, one for each address aura
          is opened at, e.g. https://aura.example.com/api/auth/oidc/callback.
        items:
          type: string
        type: array
    type: object
  config.Config_Backups:
    properties:
      keep:
        description: Number of database backups to keep before the oldest are deleted.
        type: integer
    type: object
  config.Config_CacheImages:
    properties:
      enabled:
        description: Whether to enable caching of images.
        type: boolean
    type: object
  config.Config_CustomNotification:
    properties:
      enabled:
        description: Whether custom notifications are enabled.
        type: boolean
      include_image:
        description: Whether to include an image with the custom notification.
        type: boolean
      message:
        description: Message for the custom notification.
        type: string
      title:
        description: Title for the custom notification.
        type: string
    type: object
  config.Config_ImageNameTemplates:
    properties:
      backdrop:
        type: string
      poster:
        type: string
      season_poster:
        type: string
      special_season_poster:
        type: string
      titlecard:
        type: string
    type: object
  config.Config_Images:
    properties:
      cache_images:
        allOf:
        - $ref: '#/definitions/config.Config_CacheImages'
        description: Settings for caching images.
      save_images_locally:
        allOf:
        - $ref: '#/definitions/config.Config_SaveImagesLocally'
        description: Settings for saving images locally alongside content.
    type: object
  config.Config_JobSetting:
    properties:
      cron:
        description: Cron expression for the job schedule.
        type: string
      enabled:
        type: boolean
    type: object
  config.Config_Jobs:
    properties:
      auto_download:
        allOf:
        - $ref: '#/definitions/config.Config_JobSetting'
        description: Schedule for auto-downloads.
      backup_database:
        allOf:
        - $ref: '#/definitions/config.Config_JobSetting'
        description: Schedule for backing up the database.
      check_for_media_item_changes:
        allOf:
        - $ref: '#/definitions/config.Config_JobSetting'
        description: Schedule for checking rating keys and metadata changes.
      check_for_new_media_items:
        allOf:
        - $ref: '#/definitions/config.Config_JobSetting'
        description: Schedule for adding the media server's newest items.
      check_mediux_site_link:
        allOf:
        - $ref: '#/definitions/config.Config_JobSetting'
        description: Schedule for checking MediUX site link availability.
      handle_temp_ignored_items:
        allOf:
        - $ref: '#/definitions/config.Config_JobSetting'
        description: Schedule for checking if temporarily ignored items now have sets
          on MediUX.
      refresh_media_items_and_collections:
        allOf:
        - $ref: '#/definitions/config.Config_JobSetting'
        description: Schedule for refreshing media items and collections from media
          server.
      refresh_mediux_users:
        allOf:
        - $ref: '#/definitions/config.Config_JobSetting'
        description: Schedule for refreshing tracked MediUX users/creators.
      upgrade_saved_sets:
        allOf:
        - $ref: '#/definitions/config.Config_JobSetting'
        description: Schedule for upgrading saved sets to higher ranked favorite creators.
    type: object
  config.Config_LabelsAndTags:
    properties:
      applications:
        items:
          $ref: '#/definitions/config.Config_LabelsAndTagsProvider'
        type: array
      remove_overlay_label_only_on_poster_download:
        description: Whether to remove the "Overlay" label from media items after
          downloading a poster image. This is to allow Kometa to reprocess the image
          and apply the overlays. This is a Plex exclusive feature and should be set
          to true if you have "Overlay" in your "Remove" list for the Plex application
          under "LabelsAndTags".
        type: boolean
    type: object
  config.Config_LabelsAndTagsProvider:
    properties:
      add:
        items:
          type: string
        type: array
      add_label_tag_for_selected_types:
        type: boolean
      application:
        type: string
      enabled:
        type: boolean
      remove:
        items:
          type: string
        type: array
    type: object
  config.Config_Logging:
    properties:
      file:
        description: File path for logging output.
        type: string
      keep_days:
        description: Number of days to keep old log files before they are deleted.
        type: integer
      keep_files:
        description: Number of old log files to keep before the oldest are deleted.
        type: integer
      level:
        description: Logging level (e.g., TRACE, DEBUG, INFO, WARN, ERROR).
        type: string
    type: object
  config.Config_MediaServer:
    properties:
      api_token:
        description: Authentication token for accessing the media server.
        type: string
      enable_plex_event_listener:
        description: Whether to enable the Plex event listener for reapplying images
          on refresh. Plex exclusive feature.
        type: boolean
      enable_sort_by_episode_added_date:
        description: Whether to check episodes for added date when getting Media Items.
          This is only for Plex servers.
        type: boolean
      enabled:
        description: Whether aura uses this media server. The main server is always
          enabled.
        type: boolean
      id:
        description: Unique ID of the media server.
        type: string
      libraries:
        description: List of media server libraries to manage.
        items:
          $ref: '#/definitions/models.LibrarySection'
        type: array
      library_map:
        additionalProperties:
          type: string
        description: Which main server library each library matches, by title. Not
          used for the main server.
        type: object
      name:
        description: Name of the media server shown in aura.
        type: string
      type:
        description: Type of media server (e.g., plex, emby, jellyfin).
        type: string
      url:
        description: Base URL of the media server. This is either the IP:Port or the
          domain name (e.g., plex.domain.com).
        type: string
      user_id:
        description: User ID for accessing the media server. This is used for Emby
          and Jellyfin servers. For Silo servers, this is the Profile ID.
        type: string
    type: object
  config.Config_Mediux:
    properties:
      api_token:
        description: Authentication token for accessing MediUX services.
        type: string
      download_quality:
        description: 'Quality of the media to download from MediUX (Options: "original",
          "optimized") Defaults to "optimized".'
        type: string
    type: object
  config.Config_Notification_Discord:
    properties:
      webhook:
        description: Webhook URL for the Discord notification provider.
        type: string
    type: object
  config.Config_Notification_Gotify:
    properties:
      api_token:
        description: Token for the Gotify notification provider.
        type: string
      url:
        description: URL for the Gotify notification provider.
        type: string
    type: object
  config.Config_Notification_Provider:
    properties:
      discord:
        allOf:
        - $ref: '#/definitions/config.Config_Notification_Discord'
        description: Discord notification settings
      enabled:
        description: Whether this notification method is enabled
        type: boolean
      gotify:
        allOf:
        - $ref: '#/definitions/config.Config_Notification_Gotify'
        description: Gotify notification settings
      provider:
        description: Notification provider
        type: string
      pushover:
        allOf:
        - $ref: '#/definitions/config.Config_Notification_Pushover'
        description: Pushover notification settings
      webhook:
        allOf:
        - $ref: '#/definitions/config.Config_Notification_Webhook'
        description: Webhook notification settings
    type: object
  config.Config_Notification_Pushover:
    properties:
      api_token:
        description: Token for the Pushover notification provider.
        type: string
      user_key:
        description: UserKey for the Pushover notification provider.
        type: string
    type: object
  config.Config_Notification_Webhook:
    properties:
      headers:
        additionalProperties:
          type: string
        description: Headers for the Webhook notification provider.
        type: object
      url:
        description: URL for the Webhook notification provider.
        type: string
    type: object
  config.Config_NotificationTemplate:
    properties:
      app_startup:
        allOf:
        - $ref: '#/definitions/config.Config_CustomNotification'
        description: Custom notification settings for application startup.
      autodownload:
        allOf:
        - $ref: '#/definitions/config.Config_CustomNotification'
        description: Custom notification settings for auto-download events.
      check_for_media_item_changes_job:
        allOf:
        - $ref: '#/definitions/config.Config_CustomNotification'
        description: Custom notification settings for the media item changes job.
      download_queue:
        allOf:
        - $ref: '#/definitions/config.Config_CustomNotification'
        description: Custom notification settings for download queue events.
      new_item_auto_download:
        allOf:
        - $ref: '#/definitions/config.Config_CustomNotification'
        description: Custom notification settings for sets downloaded automatically
          from the favorite creators.
      new_sets_available_for_ignored_items:
        allOf:
        - $ref: '#/definitions/config.Config_CustomNotification'
        description: Custom notification settings for when new sets become available
          for ignored items.
      silo_plugin:
        allOf:
        - $ref: '#/definitions/config.Config_CustomNotification'
        description: Custom notification settings for sets downloaded when Silo uses
          an image from the aura Silo plugin.
      sonarr_notification:
        allOf:
        - $ref: '#/definitions/config.Config_CustomNotification'
        description: Custom notification settings for Sonarr events.
      test_notification:
        allOf:
        - $ref: '#/definitions/config.Config_CustomNotification'
        description: Custom notification settings for test notifications.
    type: object
  config.Config_Notifications:
    properties:
      enabled:
        description: Whether this notification method is enabled
        type: boolean
      providers:
        description: List of notification providers
        items:
          $ref: '#/definitions/config.Config_Notification_Provider'
        type: array
      templates:
        allOf:
        - $ref: '#/definitions/config.Config_NotificationTemplate'
        description: Custom notification templates for different events
    type: object
  config.Config_SaveImagesLocally:
    properties:
      enabled:
        description: Whether to save images next to their content.
        type: boolean
      name_templates:
        allOf:
        - $ref: '#/definitions/config.Config_ImageNameTemplates'
        description: File names for each image type, empty uses the standard names
      path:
        description: By default, this is set to alongside the content. If set, this
          will override that behavior and save all images to this path.
        type: string
      running_on_windows:
        description: Whether the application is running on Windows. This affects path
          formatting.
        type: boolean
    type: object
  config.Config_SonarrRadarr_Apps:
    properties:
      applications:
        description: List of Sonarr/Radarr applications to integrate with.
        items:
          $ref: '#/definitions/config.Config_SonarrRadarrApp'
        type: array
    type: object
  config.Config_SonarrRadarrApp:
    properties:
      api_token:
        description: API key for accessing the Sonarr/Radarr server.
        type: string
      library:
        description: Name of the Media Server library associated with this Sonarr/Radarr
          instance.
        type: string
      type:
        description: Type of service (either "sonarr" or "radarr").
        type: string
      url:
        description: Base URL of the Sonarr/Radarr server.
        type: string
    type: object
  config.Config_TMDB:
    type: object
  config.Config_UserPreferences:
    properties:
      auto_download_new_items:
        description: Whether images are downloaded automatically for new items, from
          the favorite creators.
        type: boolean
      auto_upgrade_sets:
        description: Whether to automatically upgrade sets when available.
        type: boolean
      default_add_to_db_only:
        description: Whether "Add to Database Only" is checked by default in the Download
          Modal.
        type: boolean
      default_add_to_queue:
        description: Whether "Add to Queue" is checked by default in the Download
          Modal.
        type: boolean
      default_auto_add_new_collection_items:
        description: Whether "Auto Add New Collection Items" is checked by default
          in the Download Modal.
        type: boolean
      download_defaults:
        description: Image types selected by default in the Download Modal.
        items:
          type: string
        type: array
      favorite_creators:
        description: MediUX usernames ranked best first, the first is rank 1.
        items:
          type: string
        type: array
      page_views:
        additionalProperties:
          additionalProperties: {}
          type: object
        description: Each page's sort and filter options, by page, so they're the
          same on every device.
        type: object
      show_date_modified:
        description: Whether to show the date modified on poster sets.
        type: boolean
      show_only_download_defaults:
        description: Whether to only show the default image types in the Download
          Modal.
        type: boolean
    type: object
  config.NotificationTemplateVariableCatalog:
    properties:
      default_templates:
        allOf:
        - $ref: '#/definitions/config.Config_NotificationTemplate'
        description: The built-in templates, for Restore Default
      template_variables:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
    type: object
  creator.Boxset:
    properties:
      date_created:
        description: Creation date
        type: string
      date_updated:
        description: Last updated date
        type: string
      id:
        description: Set ID
        type: string
      popularity:
        description: Popularity score of the set
        type: integer
      popularity_global:
        description: Global popularity score of the set
        type: integer
      set_ids:
        additionalProperties:
          items:
            type: string
          type: array
        description: IDs of sets (show, movie, collection) in this boxset
        type: object
      sets:
        items:
          $ref: '#/definitions/models.SetRef'
        type: array
      title:
        description: Set Title
        type: string
      type:
        description: Set Type (movie, show, collection, boxset)
        type: string
      user_created:
        description: User who created the set
        type: string
    type: object
  creator.LibrarySummary:
    properties:
      sets:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  creator.Result:
    properties:
      boxsets:
        description: The page, for the boxsets tab
        items:
          $ref: '#/definitions/creator.Boxset'
        type: array
      counts:
        allOf:
        - $ref: '#/definitions/creator.TabCounts'
        description: Sets of each type matching the library and filters
      included_items:
        additionalProperties:
          $ref: '#/definitions/models.IncludedItem'
        type: object
      libraries:
        items:
          $ref: '#/definitions/creator.LibrarySummary'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      sets:
        description: The page, for the set tabs
        items:
          $ref: '#/definitions/models.SetRef'
        type: array
      tab:
        type: string
      total:
        type: integer
      total_pages:
        type: integer
      totals:
        allOf:
        - $ref: '#/definitions/creator.TabCounts'
        description: Sets of each type the creator has
    type: object
  creator.TabCounts:
    properties:
      box_sets:
        type: integer
      collection_sets:
        type: integer
      movie_sets:
        type: integer
      show_sets:
        type: integer
    type: object
  database.CreatorSetCount:
    properties:
      sets:
        type: integer
      username:
        type: string
    type: object
  database.DatabaseBackup:
    properties:
      created_at:
        type: string
      name:
        type: string
      size:
        description: Bytes
        type: integer
    type: object
  database.DownloadHistoryEntry:
    properties:
      created_at:
        type: string
      edition:
        type: string
      failed_images:
        items:
          $ref: '#/definitions/models.ImageDownloadResult'
        type: array
      id:
        type: integer
      images_failed:
        type: integer
      images_succeeded:
        type: integer
      library_title:
        type: string
      media_item_title:
        type: string
      media_item_year:
        type: integer
      next_retry_at:
        description: When it's retried automatically, nil when it isn't
        type: string
      rating_key:
        type: string
      retry_count:
        description: Times the set was retried, automatically or with Retry
        type: integer
      selected_types:
        $ref: '#/definitions/models.SelectedTypes'
      set_creator:
        type: string
      set_id:
        type: string
      set_title:
        type: string
      status:
        type: string
      tmdb_id:
        type: string
      warning_count:
        type: integer
    type: object
  database.DownloadQueueJob:
    properties:
      created_at:
        type: string
      edition:
        type: string
      finished_at:
        type: string
      id:
        type: integer
      item:
        $ref: '#/definitions/models.DBSavedItem'
      library_title:
        type: string
      media_item_title:
        type: string
      result_errors:
        items:
          type: string
        type: array
      result_message:
        type: string
      result_warnings:
        items:
          type: string
        type: array
      started_at:
        type: string
      status:
        type: string
      tmdb_id:
        type: string
    type: object
  downloadqueue.Status:
    enum:
    - Success
    - Warning
    - Error
    - Idle - Queue Empty
    - Processing
    type: string
    x-enum-varnames:
    - LAST_STATUS_SUCCESS
    - LAST_STATUS_WARNING
    - LAST_STATUS_ERROR
    - LAST_STATUS_IDLE
    - LAST_STATUS_PROCESSING
  httpx.JSONResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/logging.LogErrorInfo'
      status:
        example: success
        type: string
    type: object
  httpx.UnauthorizedResponse:
    properties:
      message:
        example: Invalid or expired token
        type: string
    type: object
  jobs.JobInfo:
    properties:
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      job_name:
        type: string
      next_run:
        type: string
      prev_run:
        type: string
      spec:
        type: string
    type: object
  library.Item:
    properties:
      added_at:
        type: integer
      db_saved_sets:
        items:
          $ref: '#/definitions/models.DBSavedSet'
        type: array
      edition:
        type: string
      has_mediux_sets:
        type: boolean
      ignored_in_db:
        type: boolean
      ignored_mode:
        type: string
      latest_episode_added_at:
        type: integer
      library_title:
        type: string
      rating_key:
        type: string
      released_at:
        type: integer
      title:
        type: string
      tmdb_id:
        type: string
      type:
        type: string
      updated_at:
        type: integer
      year:
        type: integer
    type: object
  library.LibrarySummary:
    properties:
      count:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  library.Result:
    properties:
      has_episode_added_at:
        description: Whether the "Latest Episode Added" sort is useful
        type: boolean
      has_updated_at:
        description: Whether the "Date Updated" sort is useful
        type: boolean
      items:
        items:
          $ref: '#/definitions/library.Item'
        type: array
      last_full_update:
        type: integer
      libraries:
        items:
          $ref: '#/definitions/library.LibrarySummary'
        type: array
      page:
        type: integer
      per_page:
        type: integer
      total:
        description: Items on every page
        type: integer
      total_pages:
        type: integer
    type: object
  logging.LogAction:
    properties:
      elapsed_us:
        description: Elapsed time for the action in microseconds
        type: integer
      error:
        allOf:
        - $ref: '#/definitions/logging.LogErrorInfo'
        description: Optional error details (omitted when nil)
      level:
        description: Optional level for UI filtering (e.g. "trace", "debug","info","warn","error")
        type: string
      name:
