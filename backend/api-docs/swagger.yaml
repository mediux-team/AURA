        accepts query parameters to identify the set, including the set ID, set type
        (show, movie, or collection), and the library section it belongs to. The response
        includes details about the set and any related media items that are part of
        the set, allowing clients to display comprehensive information about the set
        and its contents in the UI.
      parameters:
      - description: Unique identifier of the item set
        in: query
        name: set_id
        required: true
        type: string
      - description: Type of the item set (show, movie, or collection)
        in: query
        name: set_type
        required: true
        type: string
      - description: TMDB ID of the media item (required for collection sets)
        in: query
        name: tmdb_id
        type: string
      - description: Title of the library the set belongs to
        in: query
        name: item_library_title
        required: true
        type: string
      - description: Edition of the media item (e.g. Director's Cut), empty for the
          standard edition
        in: query
        name: edition
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/routes_mediux.GetSetByID_Response'
              type: object
        "401":
          description: Unauthorized (only when Auth.Enabled=true
          schema:
            $ref: '#/definitions/httpx.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      security:
      - SessionCookie: []
      - ApiKeyAuth: []
      summary: Get Mediux Set By ID
      tags:
      - Mediux
  /api/mediux/sets/item:
    get:
      consumes:
      - application/json
      description: Retrieve item sets for a specific media item in the library. This
        endpoint accepts query parameters to identify the media item and its library,
        and returns any related item sets (such as show sets for TV shows or movie
        sets/collections for movies) that the media item belongs to, allowing clients
        to display related items and collections in the UI.
      parameters:
      - description: TMDB ID of the media item
        in: query
        name: tmdb_id
        required: true
        type: string
      - description: Type of the media item (movie or show)
        in: query
        name: item_type
        required: true
        type: string
      - description: Title of the library the media item belongs to
        in: query
        name: item_library_title
        required: true
        type: string
      - description: Edition of the media item (e.g. Director's Cut), empty for the
          standard edition
        in: query
        name: edition
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/routes_mediux.getItemSetsResponse'
              type: object
        "401":
          description: Unauthorized (only when Auth.Enabled=true)
          schema:
            $ref: '#/definitions/httpx.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      security:
      - SessionCookie: []
      - ApiKeyAuth: []
      summary: Get Mediux Item Sets
      tags:
      - Mediux
  /api/mediux/sets/user:
    get:
      description: A creator's sets matched against one library, filtered, searched
        and sorted like the user page, with one page of one tab and the counts of
        every tab. The creator's sets are kept for 10 minutes.
      parameters:
      - description: MediUX username
        in: query
        name: username
        required: true
        type: string
      - description: Library to match against. Without it, only the libraries are
          listed
        in: query
        name: library
        type: string
      - description: showSets, movieSets, collectionSets or boxSets
        in: query
        name: tab
        type: string
      - description: Set title or the title of an item in the set
        in: query
        name: search
        type: string
      - description: inDB, notInDB or otherSetInDB
        in: query
        name: in_db
        type: string
      - description: title or dateLastUpdate
        in: query
        name: sort
        type: string
      - description: asc or desc
        in: query
        name: order
        type: string
      - description: Page, from 1
        in: query
        name: page
        type: integer
      - description: Sets per page
        in: query
        name: per_page
        type: integer
      - description: Get the creator's sets from MediUX again
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/creator.Result'
              type: object
        "401":
          description: Unauthorized (only when Auth.Enabled=true)
          schema:
            $ref: '#/definitions/httpx.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      security:
      - SessionCookie: []
      - ApiKeyAuth: []
      summary: Get Creator Sets for a Library
      tags:
      - MediUX
  /api/mediux/user:
    get:
      consumes:
      - application/json
      description: Retrieve the list of users that the current user is following or
        hiding in Mediux. This endpoint returns an array of user information, including
        their username, display name, and whether they are being followed or hidden
        by the current user. This allows clients to display the user's social connections
        and preferences within the Mediux ecosystem in the UI.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/routes_mediux.GetUserFollowingAndHiding_Response'
              type: object
        "401":
          description: Unauthorized (only when Auth.Enabled=true)
          schema:
            $ref: '#/definitions/httpx.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      security:
      - SessionCookie: []
      - ApiKeyAuth: []
      summary: Get Mediux User Following and Hiding
      tags:
      - Mediux
  /api/oauth/plex:
    get:
      consumes:
      - application/json
      description: Retrieve a new Plex Pin and the associated Plex ID for authentication.
        This endpoint is used to initiate the Plex authentication process by providing
        the necessary credentials for the user to authenticate their Plex account.
