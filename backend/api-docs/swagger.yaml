      description: Check if the provided Plex ID has authenticated with Plex and retrieve
        available server connections if authenticated. This endpoint is used during
        the Plex authentication process to verify the user's Plex account and gather
        necessary information for integration.
      parameters:
      - description: Plex ID to check for authentication
        in: query
        name: plex_id
        required: true
