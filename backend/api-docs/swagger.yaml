  /api/search:
    get:
      consumes:
      - application/json
      description: Perform a search across media items, collection items, Mediux users,
        and saved sets based on the provided query and filters. The search supports
        filtering by year, library section, and unique identifiers (TMDB ID or RatingKey)
        using specific query syntax. The response includes matching media items, collection
        items, Mediux users, and saved sets, along with metadata about the last full
        update for each category to help clients determine if they need to refresh
        their cached data.
      parameters:
      - description: The search query string with optional filters (e.g., 'Inception
          y:2010 l:Movies id:12345')
        in: query
        name: query
        required: true
        type: string
      - description: Whether to include media items in the search results
        in: query
        name: search_media_items
        type: boolean
      - description: Whether to include collection items in the search results
        in: query
        name: search_collection_items
        type: boolean
      - description: Whether to include Mediux users in the search results
        in: query
        name: search_mediux_users
        type: boolean
      - description: Whether to include saved sets in the search results
        in: query
        name: search_saved_sets
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/routes_search.HandleSearch_Response'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      summary: Search
      tags:
      - Search
