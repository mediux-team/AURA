  /api/plugin/silo/download/{token}:
    get:
      description: For a signed download path from Get Images, adds the set to the
        Download Queue for items that don't have it saved, then returns the original
        image. With notify=1 it only queues the set, the plugin calls it that way
        when Silo uses an image. Public, the signed token is the auth.
      parameters:
      - description: Signed download token
        in: path
        name: token
        required: true
        type: string
      - description: 1 to only queue the set, without the image
        in: query
        name: notify
        type: string
      - description: 1 to save the set with Auto Download on
        in: query
        name: autodownload
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: Image data
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      summary: Download an Image for the Silo Plugin
      tags:
      - Silo Plugin
  /api/plugin/silo/images:
    get:
      description: 'The MediUX images for a movie or show in aura''s libraries, the
        best ranked set first: saved sets, then favorite creator rank, then MediUX
        popularity. For a refresh, a type with saved images only has those and the
        other types only have favorite creator images; the gallery has every image.
        Each image has a preview URL and a signed download path; Silo fetching the
        download path saves the set in aura.'
      parameters:
      - description: TMDB ID of the movie or show
        in: query
        name: tmdb_id
        required: true
        type: string
      - description: movie, show or series
        in: query
        name: item_type
        required: true
        type: string
      - description: refresh (default) offers saved and favorite creator images only,
          gallery offers every image
        in: query
        name: purpose
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/routes_silo_plugin.getImagesResponse'
              type: object
        "401":
          description: Unauthorized (only when Auth.Enabled=true)
          schema:
            $ref: '#/definitions/httpx.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      security:
      - SessionCookie: []
      - ApiKeyAuth: []
      summary: Get Images for the Silo Plugin
      tags:
      - Silo Plugin
  /api/plugin/silo/status:
    get:
      description: Lets the aura Silo plugin check its URL and API key.
