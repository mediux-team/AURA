securityDefinitions:
  ApiKeyAuth:
    description: API key for programmatic/integration access. Generate one under Settings
      > Authentication, then send it as this header on every request. This is the
      intended auth method for scripts and integrations - the session cookie above
      is for browser use only.
    in: header
    name: X-Api-Key
    type: apiKey
  BasicAuth:
    type: basic
  SessionCookie:
    description: Browser session cookie, set by POST /api/login or the OIDC callback.
      Not usable directly via Swagger "Authorize" - log in through the app UI in the
      same browser tab.
    in: cookie
    name: aura_session
    type: apiKey
swagger: "2.0"
