        items:
          type: string
        name: library
        type: array
      - description: 'Home page: search'
        in: query
        name: search
        type: string
      - description: 'Home page: inDB or notInDB'
        in: query
        name: in_db
        type: string
      - description: 'Home page: ignored filter'
        in: query
        name: ignored
        type: string
      - description: 'Home page: hasSetsAvailable or noSetsAvailable'
