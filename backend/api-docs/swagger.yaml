info:
  contact: {}
  description: Used only by /api/sonarr/webhook, since Sonarr/Radarr's built-in Webhook
    connection type has no custom-header support. Any username works; the password
    must be the API key.
  title: Aura API
  version: "1.0"
paths:
  /api/:
    get:
      description: Check that aura is running and its database can be read. Returns
        500 if the database can't be read. Used by the Docker health check.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routes_base.healthCheckResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      summary: Health Check
      tags:
      - Health
  /api/auth/oidc/callback:
    get:
      description: Handles the redirect back from the OIDC identity provider, exchanges
        the authorization code, verifies the ID token, and - if the authenticated
        identity is allowed - starts a browser session the same way password login
        does.
      responses:
        "302":
          description: Found
      summary: OIDC Callback
      tags:
      - Auth
  /api/auth/oidc/login:
    get:
      description: Redirects to the configured OIDC identity provider to start a browser
        login. Not usable programmatically - this is a browser redirect flow.
      responses:
        "302":
          description: Found
      summary: Start OIDC Login
      tags:
      - Auth
  /api/config:
    get:
      description: Get the current status of the app configuration while aura is in
        setup mode. Without the setup code (X-Setup-Code header), only the app status
        is returned, not the config.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/routes_config.configStatusResponse'
              type: object
      summary: Get Config Status (Setup Mode)
      tags:
      - Config
    post:
      consumes:
      - application/json
      description: Update the application configuration
      parameters:
      - description: New Configuration
        in: body
        name: newConfig
        required: true
        schema:
          $ref: '#/definitions/routes_config.updateConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/routes_config.updateConfigResponse'
              type: object
        "401":
          description: Unauthorized (only when Auth.Enabled=true)
          schema:
            $ref: '#/definitions/httpx.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      security:
      - SessionCookie: []
      - ApiKeyAuth: []
      summary: Update Config
      tags:
      - Config
  /api/config/{section}:
    patch:
      consumes:
      - application/json
      description: Update some settings in one section of the application configuration.
        Only the settings included in the request body are changed. The section is
        validated and saved on its own, and only that section's changes are applied
        (e.g. reconnecting to the media server, restarting changed jobs).
      parameters:
      - description: Config section
        enum:
        - auth
        - logging
        - media_server
        - media_servers
        - mediux
        - jobs
        - backups
        - images
        - tmdb
        - labels_and_tags
        - notifications
        - sonarr_radarr
        - user_preferences
        in: path
        name: section
        required: true
        type: string
      - description: The settings to change, using the same field names as the config
          (e.g. {\
        in: body
        name: changes
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/routes_config.updateConfigSectionResponse'
              type: object
        "401":
          description: Unauthorized (only when Auth.Enabled=true)
          schema:
            $ref: '#/definitions/httpx.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      security:
      - SessionCookie: []
      - ApiKeyAuth: []
      summary: Update Config Section
      tags:
      - Config
  /api/config/auth-methods:
    get:
      description: Public, minimal endpoint the login page uses to know which login
        methods to show (password / OIDC SSO) before the user is authenticated.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/routes_auth.authMethodsResponse'
              type: object
      summary: Get Available Auth Methods
      tags:
      - Auth
  /api/config/auth/api-key:
    post:
      description: Generates a new global API key for programmatic access (e.g. Sonarr/Radarr
        webhooks, scripts). The plaintext key is returned exactly once in this response
        and is never stored or retrievable again - copy it immediately. Regenerating
        replaces (revokes) any previous key immediately.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/routes_auth.generateAPIKeyResponse'
              type: object
        "401":
          description: Unauthorized (only when Auth.Enabled=true)
          schema:
            $ref: '#/definitions/httpx.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      security:
      - SessionCookie: []
      - ApiKeyAuth: []
      summary: Generate/Regenerate API Key
      tags:
      - Auth
  /api/config/export:
    get:
      description: Download the full application configuration as a YAML file. With
        redacted=true, the secrets, emails and addresses are replaced so it can be
        shared; a redacted file can't be imported.
      parameters:
      - description: Replace the secrets, emails and addresses, for sharing
        in: query
        name: redacted
        type: boolean
      produces:
      - application/x-yaml
      responses:
        "200":
          description: The config as YAML
          schema:
            type: file
        "401":
          description: Unauthorized (only when Auth.Enabled=true)
          schema:
            $ref: '#/definitions/httpx.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      security:
      - SessionCookie: []
      - ApiKeyAuth: []
      summary: Export Config
      tags:
      - Config
  /api/config/import:
    post:
      consumes:
      - application/json
      description: Replace the application configuration with a config file
      parameters:
      - description: Config file contents
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/routes_config.importConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/routes_config.updateConfigResponse'
              type: object
        "401":
          description: Unauthorized (only when Auth.Enabled=true)
          schema:
            $ref: '#/definitions/httpx.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      security:
      - SessionCookie: []
      - ApiKeyAuth: []
      summary: Import Config
      tags:
      - Config
  /api/config/main-media-server:
    post:
      consumes:
      - application/json
      description: Make another media server the main one. The saved items move to
        its items, and the library maps change to its libraries.
      parameters:
      - description: Media server
        in: body
        name: server
        required: true
        schema:
          $ref: '#/definitions/routes_config.mainMediaServerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/routes_config.mainMediaServerResponse'
              type: object
        "401":
          description: Unauthorized (only when Auth.Enabled=true)
          schema:
            $ref: '#/definitions/httpx.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      security:
      - SessionCookie: []
      - ApiKeyAuth: []
      summary: Switch Main Media Server
      tags:
      - Config
  /api/config/main-media-server/preview:
    post:
      consumes:
      - application/json
      description: Show what happens to the saved items if another media server becomes
        the main one. Nothing is changed.
      parameters:
      - description: Media server
        in: body
        name: server
        required: true
        schema:
          $ref: '#/definitions/routes_config.mainMediaServerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.JSONResponse'
            - properties:
                data:
                  $ref: '#/definitions/routes_config.mainMediaServerResponse'
              type: object
        "401":
          description: Unauthorized (only when Auth.Enabled=true)
          schema:
            $ref: '#/definitions/httpx.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.JSONResponse'
      security:
      - SessionCookie: []
      - ApiKeyAuth: []
      summary: Preview Main Media Server Switch
      tags:
      - Config
  /api/config/stream:
    get:
      description: Server-Sent Events stream of the app status while aura starts or
        is in setup mode. Without the setup code, only the app status is sent, not
        the config.
      produces:
      - text/event-stream
      responses: {}
      summary: Stream Config Status (Setup Mode)
      tags:
      - Config
  /api/config/template-variables:
    get:
      description: Get all available notification template variables grouped by category
        and by template type, and the variables and standard names for saved image
        file names.
      produces:
      - application/json
      responses:
